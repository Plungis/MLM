services:
  mlm:
    build: .
    restart: unless-stopped
    ports:
      - "3157:3157"
    volumes:
      - ./config:/config
      - ./data:/data
      - ./library:/library
      # Mount qBittorrent's download directory at the same path it reports,
      # or configure qbittorrent.path_mapping in config.toml.
      # - /path/to/qbittorrent/downloads:/downloads
