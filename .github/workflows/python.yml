name: Python

on:
  push:
    branches: ["main", "agent/python-migration-beta"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install
        run: python -m pip install -e ./python pytest
      - name: Test
        run: python -m pytest -q python/tests
      - name: Compile
        run: python -m compileall -q python/src

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build python
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: python/dist/*
